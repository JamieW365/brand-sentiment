[project]
name = "brand-sentiment"
version = "0.1.0"
description = "End to end NLP platform for multi-dimensional brand sentiment analysis"
authors = [
    {name = "JamieW365",email = "jamiewelch1011@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "boto3 (>=1.43.103,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "shared" }
]