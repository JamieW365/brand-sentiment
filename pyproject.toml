[project]
name = "brand-sentiment"
version = "0.1.0"
description = "End to end NLP platform for multi-dimensional brand sentiment analysis"
authors = [
    {name = "JamieW365",email = "jamiewelch1011@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "shared" }
]

[tool.poetry.group.db]
optional = true

[tool.poetry.group.db.dependencies]
sqlalchemy = {version = ">=2.1.1,<3.0.0", extras = ["asyncio"]}
asyncpg = ">=0.31.0,<0.32.0"

[tool.poetry.group.aws]
optional = true

[tool.poetry.group.aws.dependencies]
boto3 = ">=1.43.103,<2.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
[tool.poetry.group.ingestion.dependencies]
requests = "^2.34.2"

[tool.pytest.ini_options]
# Adds the repo root to sys.path so root-relative imports resolve correctly
# in all environments — local, CI, and across different Python tooling.
pythonpath = ["."]
# Tells pytest where to look for tests rather than scanning the whole repo.
testpaths = ["ingestion/tests"]